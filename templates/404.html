{% extends "base.html" %}

{% block title %}Not found - Duck Store{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div style="font-size: 4rem;">🦆</div>
    <h1 class="h2">{{ 'Something is off' if message else 'This duck flew away' }}</h1>
    <p class="text-muted">{{ message or "We couldn't find that page." }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to the shop</a>
</div>
{% endblock %}
