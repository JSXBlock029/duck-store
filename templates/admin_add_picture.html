{% extends "base.html" %}

{% block title %}Add Picture - Duck Store Admin{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 760px;">
    <h1 class="h3 mb-4">Add a picture</h1>
    <div class="card">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                {% with values = form or {} %}{% include "_picture_form.html" %}{% endwith %}
                <div class="mb-3">
                    <label for="picture" class="form-label">Image file (png, jpg, gif, webp, up to 16 MB)</label>
                    <input type="file" class="form-control" id="picture" name="picture" accept="image/png,image/jpeg,image/gif,image/webp" required>
                </div>
                <button type="submit" class="btn btn-primary">Save picture</button>
                <a href="{{ url_for('admin_pictures') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
